name: 新增模板需求
description: 提议新增一个数据图表或学术示意图模板
title: "[模板] "
labels: ["template"]
body:
  - type: markdown
    attributes:
      value: |
        先自查一遍：**一次性图型不要做模板**，直接手写更快。只有「换一批数据/文案后结构仍成立」的图型才值得进模板库。
  - type: dropdown
    id: skill
    attributes:
      label: 属于哪个技能
      options:
        - mathmodel-figure（数据图表）
        - mathmodel-diagram（学术示意图）
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: 图型语义与使用场景
      description: 这张图要表达什么结论？哪些槽位是并列、哪些是汇流或对比？
      placeholder: 例如：多方案在多指标下的对比，柱组内并列、组间可比；主要用于第 5 章的方案比选。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考图或数据形态
      description: 有参考图请附链接或图片；说明数据结构（是矩阵、分组序列还是层次结构）。
  - type: textarea
    id: fields
    attributes:
      label: 预期输入字段
      description: 若为示意图模板，请列出 content JSON 的顶层字段与必备字段。
      placeholder: |
        canvas / font_size / modules[{id,text,kind,x,y,w,h}] / edges[{from,to,...}]
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: 字数预算（若已知）
      description: 每个槽位大约能容纳多少汉字？不要求精确，但请说明是实测还是估计。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该图型会反复出现，值得做成模板
          required: true
        - label: 我已搜过现有模板，确认没有可直接复用的
          required: true
