# 轻量验证：全部 Python 脚本语法 + 模板注册表一致性（含内容契约与主题契约）
# + 20 个数据图表模板渲染 + 5 个示意图模板校验/渲染 + 降 AI 门禁冒烟（词表级 + 结构级 + 零宽清理）
# + 论文评分卡与章节结构冒烟（结构 hard 未过 1 / 评分卡达标 0 / 需优化 1 / 输入错误 2）
# 模板数量与清单均由 code/**/manifest.json 派生，不再硬编码，新增模板无需改本文件。
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile all bundled scripts
        run: python -m compileall -q skills

  manifest-consistency:
    name: Manifest & contract consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Registries vs filesystem / index docs / version / badges
        shell: bash
        run: |
          python - "$GITHUB_WORKSPACE" <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          errors = []

          FIGURE = root / "skills" / "mathmodel-figure" / "code" / "tools" / "manifest.json"
          DIAGRAM = root / "skills" / "mathmodel-diagram" / "code" / "templates" / "manifest.json"
          FIGURE_KEYS = ["id", "script", "title", "group", "aliases", "cjk_hints", "preview", "author"]
          DIAGRAM_KEYS = ["id", "script", "title", "summary", "canvas", "schema", "example",
                          "preview", "doc", "aliases", "cjk_hints", "author"]

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: unreadable manifest ({exc})")
                  return {"templates": []}

          def check(manifest_path, keys, index_doc, glob_pattern, extra_paths):
              manifest = load(manifest_path)
              base = manifest_path.parent
              script_dir = (base / manifest.get("script_dir", ".")).resolve()
              entries = manifest.get("templates", [])
              if not entries:
                  errors.append(f"{manifest_path}: no templates registered")

              ids = [e.get("id") for e in entries]
              if len(ids) != len(set(ids)):
                  errors.append(f"{manifest_path}: duplicate ids {sorted(ids)}")

              for entry in entries:
                  tag = f"{manifest_path.name}:{entry.get('id')}"
                  for key in keys:
                      if key not in entry:
                          errors.append(f"{tag}: missing key '{key}'")
                  if not (script_dir / entry.get("script", "")).exists():
                      errors.append(f"{tag}: script not found ({script_dir / entry.get('script', '')})")
                  for key in extra_paths:
                      value = entry.get(key)
                      if value is not None and not (base / value).exists():
                          errors.append(f"{tag}: {key} not found ({base / value})")
                  if entry.get("id") and f"`{entry['id']}`" not in index_doc.read_text(encoding="utf-8"):
                      errors.append(f"{tag}: not listed in {index_doc.relative_to(root)}")

              orphans = sorted({p.name for p in script_dir.glob(glob_pattern)}
                               - {e.get("script") for e in entries})
              if orphans:
                  errors.append(f"{manifest_path.name}: unregistered template scripts {orphans}")
              return entries

          figure_entries = check(FIGURE, FIGURE_KEYS,
                                 root / "skills/mathmodel-figure/docs/templates/figure-catalog.md",
                                 "make_*.py", ["preview"])
          diagram_entries = check(DIAGRAM, DIAGRAM_KEYS,
                                  root / "skills/mathmodel-diagram/SKILL.md",
                                  "*.py", ["schema", "example", "preview", "doc"])
          total = len(figure_entries) + len(diagram_entries)

          version_file = root / "VERSION"
          version = version_file.read_text(encoding="utf-8").strip() if version_file.exists() else ""
          if not version:
              errors.append("VERSION missing or empty")
          else:
              changelog = root / "CHANGELOG.md"
              if not changelog.exists():
                  errors.append("CHANGELOG.md missing")
              elif f"## [{version}]" not in changelog.read_text(encoding="utf-8"):
                  errors.append(f"CHANGELOG.md has no section for {version}")

          default_theme = root / "skills" / "mathmodel-figure" / "themes" / "nature.theme.json"
          if not default_theme.exists():
              errors.append("default theme themes/nature.theme.json missing "
                            "(plot_style.py fallback chain points at it)")

          skills = sorted(p.name for p in (root / "skills").iterdir() if p.is_dir())
          readme = (root / "README.md").read_text(encoding="utf-8")

          registry = root / "skills" / "manifest.json"
          if not registry.exists():
              errors.append("skills/manifest.json missing")
          else:
              reg = load(registry)
              entries = reg.get("skills", [])
              reg_names = sorted(e.get("name") for e in entries)
              if reg_names != skills:
                  errors.append(f"skills/manifest.json names {reg_names} != directories {skills}")
              for e in entries:
                  name = e.get("name")
                  tag = f"skills/manifest.json:{name}"
                  if e.get("kind") not in ("core", "knowledge", "tool"):
                      errors.append(f"{tag}: invalid kind {e.get('kind')!r}")
                  if e.get("contribution") not in ("open", "maintainer"):
                      errors.append(f"{tag}: invalid contribution {e.get('contribution')!r}")
                  skill_dir = root / "skills" / str(name)
                  if not (skill_dir / e.get("entry", "SKILL.md")).exists():
                      errors.append(f"{tag}: entry not found")
                  if e.get("kind") != "core" and not (skill_dir / "README.md").exists():
                      errors.append(f"{tag}: README.md missing (required for knowledge/tool kinds)")
                  for rel in e.get("docs", []):
                      if not (skill_dir / rel).exists():
                          errors.append(f"{tag}: doc not found ({rel})")
                  if f"skills/{name}/SKILL.md" not in readme:
                      errors.append(f"{tag}: not listed in README.md skill table")

          for label, encoded, expected in (("技能", "%E6%8A%80%E8%83%BD", str(len(skills))),
                                           ("模板", "%E6%A8%A1%E6%9D%BF", str(total))):
              if f"{encoded}-{expected}-" not in readme:
                  errors.append(f"README {label} badge does not say {expected}")

          print(f"skills={len(skills)} figures={len(figure_entries)} diagrams={len(diagram_entries)} "
                f"templates={total} version={version or 'n/a'}")
          for line in errors:
              print("ERROR:", line)
          sys.exit(1 if errors else 0)
          PYEOF
      - name: JSON Schema self-check and bundled example validation
        shell: bash
        run: |
          cd skills/mathmodel-diagram
          python code/tools/validate_content.py --schemas
          python code/tools/validate_content.py --all
      - name: Theme contract validation
        shell: bash
        run: |
          cd skills/mathmodel-figure
          python code/tools/validate_theme.py --all

  figures:
    name: Figure templates render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CJK fonts (图内中文渲染)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render every template and verify PNG/PDF/SVG outputs
        shell: bash
        run: |
          cd skills/mathmodel-figure
          expected=$(python -c "import json,pathlib;print(len(json.loads(pathlib.Path('code/tools/manifest.json').read_text(encoding='utf-8'))['templates']))")
          count=0
          for id in $(python code/tools/render_template.py --list); do
            echo "::group::render $id"
            python code/tools/render_template.py "$id" --project "$RUNNER_TEMP/ci-figs/$id"
            out="$RUNNER_TEMP/ci-figs/$id/outputs"
            for suffix in png pdf svg; do
              if ! compgen -G "$out/*_replica.$suffix" > /dev/null; then
                echo "ERROR: missing *_replica.$suffix output for $id"
                exit 1
              fi
            done
            scripts="$RUNNER_TEMP/ci-figs/$id/scripts"
            if [ -f "$scripts/plot_style.py" ] && [ ! -f "$scripts/theme.json" ]; then
              echo "ERROR: plot_style.py copied without theme.json for $id"
              exit 1
            fi
            count=$((count+1))
            echo "::endgroup::"
          done
          if [ "$count" -ne "$expected" ]; then
            echo "ERROR: manifest registers $expected templates, rendered $count"
            exit 1
          fi
          echo "All $count figure templates rendered with PNG/PDF/SVG outputs."
      - name: Theme override smoke (custom theme reaches the workspace)
        shell: bash
        run: |
          cd skills/mathmodel-figure
          python - <<'PYEOF'
          import json, subprocess, sys, tempfile
          from pathlib import Path

          theme = json.loads(Path("themes/nature.theme.json").read_text(encoding="utf-8"))
          theme["name"] = "ci-probe"
          theme["roles"]["identity"]["main"] = "#0B7285"

          work = Path(tempfile.mkdtemp())
          custom = work / "probe.theme.json"
          custom.write_text(json.dumps(theme), encoding="utf-8")

          subprocess.run([sys.executable, "code/tools/render_template.py", "grouped-bar",
                          "--project", str(work / "out"), "--theme", str(custom)], check=True)
          landed = json.loads((work / "out" / "scripts" / "theme.json").read_text(encoding="utf-8"))
          assert landed["roles"]["identity"]["main"] == "#0B7285", landed

          probe = subprocess.run(
              [sys.executable, "-c",
               "import sys;sys.path.insert(0,r'%s');import plot_style as s;print(s.COLOR_MAIN)"
               % (work / "out" / "scripts")],
              capture_output=True, text=True, check=True)
          assert probe.stdout.strip() == "#0B7285", probe.stdout
          print("theme override smoke OK: custom theme reached workspace plot_style")
          PYEOF

  diagrams:
    name: Diagram templates check & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install CJK fonts (容量校验与图内中文量宽)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capacity checks (--check on bundled examples)
        shell: bash
        run: |
          cd skills/mathmodel-diagram
          example_of() {
            python -c "import json,os,sys;m=json.load(open('code/templates/manifest.json',encoding='utf-8'));e=next(t for t in m['templates'] if t['id']==sys.argv[1]);print(os.path.normpath(os.path.join('code/templates',e['example'])))" "$1"
          }
          for id in $(python code/tools/render_template.py --list); do
            echo "::group::$id --check"
            python code/tools/render_template.py "$id" "$(example_of "$id")" --check
            echo "::endgroup::"
          done
      - name: Render bundled examples and verify PNG/PDF outputs
        shell: bash
        run: |
          cd skills/mathmodel-diagram
          expected=$(python -c "import json,pathlib;print(len(json.loads(pathlib.Path('code/templates/manifest.json').read_text(encoding='utf-8'))['templates']))")
          count=0
          for id in $(python code/tools/render_template.py --list); do
            echo "::group::render $id"
            python code/tools/render_template.py "$id" "examples/$id/example.json" -o "$RUNNER_TEMP/ci-diag/$id.png"
            test -s "$RUNNER_TEMP/ci-diag/$id.png" || { echo "ERROR: missing PNG for $id"; exit 1; }
            test -s "$RUNNER_TEMP/ci-diag/$id.pdf" || { echo "ERROR: missing PDF for $id"; exit 1; }
            count=$((count+1))
            echo "::endgroup::"
          done
          if [ "$count" -ne "$expected" ]; then
            echo "ERROR: manifest registers $expected templates, rendered $count"
            exit 1
          fi
          echo "All $count diagram examples passed capacity checks and rendered PNG+PDF."

  strip-invisible:
    name: Invisible-char scrubber smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: tex / docx / pdf round-trip (FOUND -> CLEANED -> clean)
        shell: bash
        run: |
          TOOL=skills/mathmodel-deai/code/strip_invisible.py
          WORK="$RUNNER_TEMP/strip-smoke"
          mkdir -p "$WORK"
          python - "$WORK" "$TOOL" <<'PYEOF'
          import subprocess, sys
          from pathlib import Path

          work, tool = Path(sys.argv[1]), sys.argv[2]

          def run(args, expect):
              r = subprocess.run([sys.executable, tool, *map(str, args)],
                                 capture_output=True, text=True)
              print(r.stdout.strip() or r.stderr.strip())
              assert r.returncode == expect, f"expect {expect}, got {r.returncode}: {args}"

          # tex: BOM + ZWSP + invisible times + tag char
          tex = work / "s.tex"
          tex.write_bytes("A\u200bB\u2062C\U000E0041\n".encode("utf-8"))
          run([tex], 1)
          run(["--clean", "--no-backup", tex], 0)
          run([tex], 0)
          assert tex.read_text(encoding="utf-8") == "ABC\n", tex.read_text()

          # docx: 正文与元数据混入零宽
          import docx
          dx = work / "s.docx"
          d = docx.Document()
          d.add_paragraph("正\u200b常\ufeff文\u2062字")
          d.core_properties.title = "零\u200b宽\U000E0020"
          d.save(dx)
          run([dx], 1)
          run(["--clean", "--no-backup", dx], 0)
          run([dx], 0)

          # pdf: 手写最小 Type0/Identity-H + ToUnicode（含 200B/2060 映射）
          tounicode = (
              "/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n"
              "/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n"
              "1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n"
              "4 beginbfchar\n<0041> <0041>\n<200B> <200B>\n<0042> <0042>\n<2060> <2060>\n"
              "endbfchar\nendcmap\nCMapName currentdict /CMap defineresource pop\nend\nend\n"
          )
          content = "BT /F1 24 Tf 72 720 Td <0041200B00422060> Tj ET\n"
          objs = {
              1: b"<< /Type /Catalog /Pages 2 0 R >>",
              2: b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              3: (b"<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 4 0 R >> >> "
                  b"/MediaBox [0 0 612 792] /Contents 5 0 R >>"),
              4: (b"<< /Type /Font /Subtype /Type0 /BaseFont /Test /Encoding /Identity-H "
                  b"/DescendantFonts [6 0 R] /ToUnicode 7 0 R >>"),
              5: b"<< /Length " + str(len(content)).encode() + b" >>\nstream\n"
                 + content.encode("latin-1") + b"endstream",
              6: (b"<< /Type /Font /Subtype /CIDFontType2 /BaseFont /Test "
                  b"/CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> "
                  b"/FontDescriptor 8 0 R /DW 1000 >>"),
              7: b"<< /Length " + str(len(tounicode)).encode() + b" >>\nstream\n"
                 + tounicode.encode("latin-1") + b"endstream",
              8: (b"<< /Type /FontDescriptor /FontName /Test /Flags 4 "
                  b"/FontBBox [0 0 1000 1000] /ItalicAngle 0 /Ascent 800 /Descent -200 "
                  b"/CapHeight 800 /StemV 80 >>"),
          }
          out = bytearray(b"%PDF-1.4\n")
          offs = {}
          for num in sorted(objs):
              offs[num] = len(out)
              out += f"{num} 0 obj\n".encode() + objs[num] + b"\nendobj\n"
          x = len(out)
          out += f"xref\n0 {len(objs)+1}\n".encode() + b"0000000000 65535 f \n"
          for num in sorted(objs):
              out += f"{offs[num]:010d} 00000 n \n".encode()
          out += (f"trailer\n<< /Size {len(objs)+1} /Root 1 0 R >>\n"
                  f"startxref\n{x}\n%%EOF\n").encode()
          pdf = work / "s.pdf"
          pdf.write_bytes(bytes(out))
          run([pdf], 1)
          run(["--clean", "--no-backup", pdf], 0)
          run([pdf], 0)
          import fitz
          text = fitz.open(pdf)[0].get_text()
          assert "\u200b" not in text and "\u2060" not in text and "A" in text and "B" in text, repr(text)
          print("strip-invisible smoke OK:", repr(text))
          PYEOF

  deai-phrasing:
    name: De-AI phrasing gate smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Word-list samples flagged/pass, docs self-clean (zh + en)
        shell: bash
        run: |
          cd skills/mathmodel-deai
          check() {  # $1 = file, $2 = expected exit code
            set +e
            python code/check_phrasing.py "$1" > /dev/null
            got=$?
            set -e
            echo "$1 exit=$got (want $2)"
            if [ "$got" -ne "$2" ]; then echo "ERROR: $1 should exit $2"; exit 1; fi
          }
          check examples/slop-sample.tex 1
          check examples/clean-sample.tex 0
          check examples/slop-sample-en.md 1
          check examples/clean-sample-en.md 0
          # the skill's own docs must pass the gate (examples are excluded by design)
          python code/check_phrasing.py SKILL.md README.md docs/deai-rules.md
          echo "deai word-list gate smoke OK (zh + en)."
      - name: Structural gate smoke (style-slop flagged, clean passes)
        shell: bash
        run: |
          cd skills/mathmodel-deai
          set +e
          python code/check_style.py examples/style-slop-sample.tex
          slop=$?
          python code/check_style.py examples/clean-sample.tex
          clean=$?
          set -e
          echo "style-slop exit=$slop (want 1); clean exit=$clean (want 0)"
          if [ "$slop" -ne 1 ]; then echo "ERROR: style-slop sample should exit 1"; exit 1; fi
          if [ "$clean" -ne 0 ]; then echo "ERROR: clean sample should exit 0 under check_style"; exit 1; fi
          echo "deai structural gate smoke OK."
      - name: Cross-module docs pass the word-list gate; paper-like examples pass the structural gate
        shell: bash
        run: |
          # 表述口径以去 AI 模块为准：README、全部 docs/ 文档与评分模块文档过词表级；
          # 结构级指标面向论文稿与论文样例
          cd skills/mathmodel-deai
          python code/check_style.py ../mathmodel-score/examples/chapter-sample.tex
          cd ../..
          # 清单由 git 派生，新增 docs/ 文档自动纳入，无需改 CI
          mapfile -t DOCS < <(git ls-files '*.md' | grep -E '(^|/)docs/|^README(_EN)?\.md$')
          DOCS+=(skills/mathmodel-score/SKILL.md skills/mathmodel-score/README.md)
          echo "word-list gate over ${#DOCS[@]} files"
          python skills/mathmodel-deai/code/check_phrasing.py "${DOCS[@]}"
          echo "cross-module de-AI gate OK."

  scorecard:
    name: Scorecard & chapter gate smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Chapter structure gate (sample passes, missing-sample fails)
        shell: bash
        run: |
          cd skills/mathmodel-score
          set +e
          python code/check_chapters.py examples/chapter-sample.tex > /dev/null
          ok=$?
          python code/check_chapters.py examples/chapter-missing-sample.tex > /dev/null
          bad=$?
          set -e
          echo "chapter sample exit=$ok (want 0); missing-sample exit=$bad (want 1)"
          if [ "$ok" -ne 0 ]; then echo "ERROR: chapter sample should pass all hard checks"; exit 1; fi
          if [ "$bad" -ne 1 ]; then echo "ERROR: chapter missing-sample should fail hard checks"; exit 1; fi
          python code/check_chapters.py --rules mcm examples/chapter-sample.tex > /dev/null
          python code/check_chapters.py --list-checks > /dev/null
          python code/check_chapters.py --list-checks --json > /dev/null
          echo "chapter structure gate smoke OK."
      - name: Example passes (0), below-pass needs work (1), bad input is rejected (2)
        shell: bash
        run: |
          cd skills/mathmodel-score
          set +e
          python code/score_card.py examples/example-scorecard.json > /dev/null
          ok=$?
          set -e
          echo "example exit=$ok (want 0)"
          if [ "$ok" -ne 0 ]; then echo "ERROR: example scorecard should pass"; exit 1; fi
          python code/score_card.py --list-dimensions > /dev/null
          python code/score_card.py --list-dimensions --json > /dev/null
          python - <<'PYEOF'
          import json, subprocess, sys, tempfile
          from pathlib import Path

          work = Path(tempfile.mkdtemp())
          base = json.loads(Path("examples/example-scorecard.json").read_text(encoding="utf-8"))
          for dim in base["dimensions"]:
              dim["score"] = 12 if dim["id"] in ("abstract", "model", "innovation") else 8
              dim["deductions"] = []
          low = work / "below-pass.json"
          low.write_text(json.dumps(base), encoding="utf-8")
          r = subprocess.run([sys.executable, "code/score_card.py", str(low)], capture_output=True, text=True)
          print("below-pass exit", r.returncode)
          assert r.returncode == 1, r.stdout + r.stderr

          bad = work / "bad.json"
          bad.write_text(json.dumps({"dimensions": [{"id": "abstract", "score": 99}]}), encoding="utf-8")
          r2 = subprocess.run([sys.executable, "code/score_card.py", str(bad)], capture_output=True, text=True)
          print("bad-input exit", r2.returncode)
          assert r2.returncode == 2, r2.stdout + r2.stderr

          print("scorecard gate smoke OK")
          PYEOF

  word-postprocess:
    name: Word post-processing smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Missing input exits 2; restyling edits style only, never content
        shell: bash
        run: |
          cd skills/mathmodel-paper
          set +e
          python code/word_postprocess.py no_such.docx > /dev/null 2>&1
          miss=$?
          set -e
          echo "missing input exit=$miss (want 2)"
          if [ "$miss" -ne 2 ]; then echo "ERROR: missing input should exit 2"; exit 1; fi
          python - <<'PYEOF'
          import subprocess, sys, tempfile
          from pathlib import Path

          import docx

          work = Path(tempfile.mkdtemp())
          src = work / "paper.docx"
          d = docx.Document()
          d.add_heading("一、问题重述", level=1)
          d.add_paragraph("正文段落，含中文与数字 12.4。")
          table = d.add_table(rows=2, cols=2)
          table.cell(0, 0).text = "指标"
          table.cell(1, 0).text = "MAE"
          d.sections[0].header.paragraphs[0].text = "XX大学 张三 2026"
          d.save(src)

          opened = docx.Document(src)
          before = (len(opened.paragraphs), len(opened.tables))
          assert opened.sections[0].header.paragraphs[0].text.strip() == "XX大学 张三 2026"

          r = subprocess.run([sys.executable, "code/word_postprocess.py", str(src)],
                             capture_output=True, text=True)
          print(r.stdout.strip() or r.stderr.strip())
          assert r.returncode == 0, (r.returncode, r.stdout, r.stderr)

          after_doc = docx.Document(src)
          after = (len(after_doc.paragraphs), len(after_doc.tables))
          assert before == after, f"content changed: {before} -> {after}"
          assert after_doc.sections[0].header.paragraphs[0].text.strip() == "", "header not cleared"
          assert "PAGE" in after_doc.sections[0].footer._element.xml, "footer page field missing"
          print("word post-process smoke OK:", before)
          PYEOF
